[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-agent"
version = "0.1.0"
description = "A natural-language data science agent: SQL, metric anomaly detection, contribution decomposition, experiment design and causal inference."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "duckdb>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "requests>=2.31",
    "matplotlib>=3.8",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Open-source causal engines (graceful fallback to in-house estimators when absent).
oss-causal = ["dowhy>=0.11", "networkx>=3.0", "pydot>=2.0", "sympy>=1.12", "tqdm>=4.64", "causal-learn>=0.1.3"]
# Deep-learning backends (autoencoder falls back to scikit-learn MLP when absent).
dl = ["torch>=2.2"]
# Modeling toolkit (scikit-learn already ships with the core stats stack; SHAP
# upgrades feature analysis from permutation importance to true SHAP values).
modeling = ["scikit-learn>=1.4", "shap>=0.45"]

[project.scripts]
ds-agent = "ds_agent.cli:main"

[tool.setuptools.packages.find]
include = ["ds_agent*"]

[tool.setuptools.package-data]
ds_agent = ["web_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
